name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno task secrets
      - run: deno task test:secrets
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno test --allow-read --allow-env --allow-net=127.0.0.1 api/tests/deno_version_test.ts api/tests/deploy_test.ts api/tests/revision_test.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno task coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: .cache/coverage/
          # The cache is hidden; include only this scoped report directory.
          include-hidden-files: true
          retention-days: 7
      # Builds and exercises the production image/entrypoint on disposable state.
      - run: deno task test:shutdown

  # A green main proves tests AND the exact tested revision's live readiness.
  # Hold serialization through pinning, queue acceptance and bounded polling.
  # Missing credentials fail; PR checks deliberately do not deploy.
  deploy:
    needs: [checks, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      DEPLOY_HEALTH_URL: https://trainer.marcoazzurrini.com/api/health
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Deploy and verify the tested revision
        run: deno task deploy
