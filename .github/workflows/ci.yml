name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The commit hook scans staged changes. This scans the whole checkout,
      # before dependencies are installed into it, and leaves Gitleaks on the
      # PATH for the hook test.
      - name: Scan the checkout for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
      - run: bun install --frozen-lockfile
      - run: bun run check:style
      - run: bun run check
      - run: bun run test:tooling
      - run: bun run --cwd apps/api build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Bun clients use a clean environment, no .env loading and local fixtures.
      # The application itself still executes in workerd with ephemeral D1.
      - run: bun run --cwd apps/api test

  d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db check
      - run: bun run --cwd packages/db test
      - run: bun run --cwd apps/api test:d1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build
      - run: bun run --cwd apps/web check
      - run: bun run --cwd apps/web test
      - run: bun run --cwd apps/web playwright install --with-deps chromium
      - run: bun run --cwd apps/web test:browser
      - run: bun run --cwd apps/web test:workers

  # One serialized release from the tested commit. PRs never deploy, and a
  # release that is already running is never cancelled halfway.
  deploy:
    needs: [checks, test, d1, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # A dashboard that fails to build must stop the release before production changes.
      - name: Build the dashboard
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: bun run --cwd apps/web build
      # Migrations land first, so each one must also work with the API still running.
      - name: Apply database migrations
        run: bun run --cwd apps/api db:migrate:remote
      - name: Deploy the API
        run: bun run --cwd apps/api deploy --message "Commit $GITHUB_SHA" --define "__BUILD_REVISION__:\"$GITHUB_SHA\""
      - name: Wait for the API to serve this commit
        env:
          HEALTH_URL: https://trainer.marcoazzurrini.com/api/health
        run: |
          for attempt in $(seq 60); do
            curl -sS --max-time 10 "$HEALTH_URL?release_probe=$RANDOM$attempt" \
              | jq -e --arg sha "$GITHUB_SHA" '.revision == $sha' > /dev/null && exit 0
            sleep 5
          done
          echo "::error::The API never reported $GITHUB_SHA. The Worker or a migration may already be live; inspect before retrying."
          exit 1
      - name: Deploy the dashboard
        run: bun run --cwd apps/web deploy --message "Commit $GITHUB_SHA"
      - name: Wait for the dashboard to serve this commit
        env:
          HEALTH_URL: https://app.trainer.marcoazzurrini.com/api/health
        run: |
          for attempt in $(seq 60); do
            curl -sS --max-time 10 "$HEALTH_URL?release_probe=$RANDOM$attempt" \
              | jq -e --arg sha "$GITHUB_SHA" '.revision == $sha' > /dev/null && exit 0
            sleep 5
          done
          echo "::error::The dashboard never reported $GITHUB_SHA. It may already be live; inspect before retrying."
          exit 1
