name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Docker is still used by the secret scanner, not by the application.
      - run: bun run secrets
      - run: bun run check:style
      - run: bun run check
      - run: bun run test:tooling
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Bun clients use a clean environment, no .env loading and local fixtures.
      # The application itself still executes in workerd with ephemeral D1.
      - run: bun run test:api

  d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:d1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd web build
      - run: bun run --cwd web check
      - run: bun run --cwd web test
      - run: bun run --cwd web playwright install --with-deps chromium
      - run: bun run --cwd web test:browser
      - run: bun run --cwd web test:workers

  # Keep migrations, API readiness, dashboard deployment and public verification
  # inside one serialized release. PRs never deploy; missing secrets fail closed.
  deploy:
    needs: [checks, test, d1, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      DEPLOY_HEALTH_URL: https://trainer.marcoazzurrini.com/api/health
      DASHBOARD_HEALTH_URL: https://app.trainer.marcoazzurrini.com/api/health
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Validate both release configurations
        run: |
          bun --no-env-file run - <<'JS'
          import { sourceRevision } from './scripts/build-worker.ts';
          for (const key of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'GITHUB_SHA']) {
            if (!process.env[key]?.trim()) throw new Error(`Deployment requires ${key}.`);
          }
          sourceRevision(process.env.GITHUB_SHA);
          for (const key of ['DEPLOY_HEALTH_URL', 'DASHBOARD_HEALTH_URL']) {
            const url = new URL(process.env[key]);
            if (url.protocol !== 'https:' || url.username || url.password || url.hash || url.search || url.pathname !== '/api/health') {
              throw new Error(`${key} must be a public HTTPS /api/health URL without credentials, query or fragment.`);
            }
          }
          JS
      - name: Build the dashboard before changing production
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: bun run --cwd web build
      - name: Validate dashboard build identity
        run: |
          bun --no-env-file run - <<'JS'
          import { readFile } from 'node:fs/promises';
          const metadata = JSON.parse(await readFile('web/.output/build.json', 'utf8'));
          if (metadata.revision !== process.env.GITHUB_SHA || !/^[a-f0-9]{64}$/.test(metadata.digest)) {
            throw new Error('Dashboard build must identify the exact tested revision and artifact.');
          }
          JS
      # This command applies D1 migrations, deploys the API and verifies its
      # exact immutable build at the public readiness endpoint before returning.
      - name: Migrate, deploy and verify the API build
        run: bun run deploy
      - name: Deploy the dashboard build
        run: bun run --cwd web deploy
      - name: Verify the public dashboard build
        run: |
          bun --no-env-file run - <<'JS'
          import { readFile } from 'node:fs/promises';
          import { verifyRelease } from './scripts/deploy-worker.ts';
          const metadata = JSON.parse(await readFile('web/.output/build.json', 'utf8'));
          await verifyRelease(process.env.DASHBOARD_HEALTH_URL, metadata);
          JS
