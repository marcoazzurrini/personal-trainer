name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno task secrets
      - run: deno task test:secrets
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno test --allow-read tests/deno_version_test.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno task test
      # Builds and exercises the production image/entrypoint on disposable state.
      - run: deno task test:shutdown

  # Only a green main reaches the host: Coolify's own deploy-on-push stays
  # off, and this webhook is the one way a deploy starts. Until the secrets
  # exist the step is skipped, not failed.
  deploy:
    needs: [checks, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Ask Coolify to deploy
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl -fsS -X POST "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
