name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno task secrets
      - run: deno task test:secrets
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno test --allow-read --allow-env --allow-net=127.0.0.1 api/tests/deno_version_test.ts api/tests/deploy_test.ts api/tests/revision_test.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno task coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: .cache/coverage/
          # The cache is hidden; include only this scoped report directory.
          include-hidden-files: true
          retention-days: 7
      # Builds and exercises the production image/entrypoint on disposable state.
      - run: deno task test:shutdown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run build
      - run: npm --prefix web run check
      - run: npm --prefix web test
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: npm --prefix web run test:browser
      - run: npm --prefix web run test:container

  # A green main proves tests AND the exact tested revision's live readiness.
  # Hold serialization through pinning, queue acceptance and bounded polling.
  # Missing credentials fail; PR checks deliberately do not deploy.
  deploy:
    needs: [checks, test, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_DASHBOARD_WEBHOOK: ${{ secrets.COOLIFY_DASHBOARD_WEBHOOK }}
      DEPLOY_HEALTH_URL: https://trainer.marcoazzurrini.com/api/health
      DASHBOARD_HEALTH_URL: https://app.trainer.marcoazzurrini.com/api/health
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      # Check both targets before changing either application's commit pin.
      - name: Validate both release configurations
        run: |
          deno eval '
            import { deploymentConfig } from "./scripts/deploy.ts";
            const common = Object.fromEntries(
              ["COOLIFY_TOKEN", "GITHUB_SHA", "GITHUB_REPOSITORY"].map(key => [key, Deno.env.get(key)])
            );
            deploymentConfig({ ...common,
              COOLIFY_WEBHOOK: Deno.env.get("COOLIFY_WEBHOOK"),
              DEPLOY_HEALTH_URL: Deno.env.get("DEPLOY_HEALTH_URL")
            });
            deploymentConfig({ ...common,
              COOLIFY_WEBHOOK: Deno.env.get("COOLIFY_DASHBOARD_WEBHOOK"),
              DEPLOY_HEALTH_URL: Deno.env.get("DASHBOARD_HEALTH_URL")
            });
          '
      - name: Deploy and verify the API revision
        run: deno task deploy
      - name: Deploy and verify the dashboard revision
        env:
          COOLIFY_WEBHOOK: ${{ env.COOLIFY_DASHBOARD_WEBHOOK }}
          DEPLOY_HEALTH_URL: ${{ env.DASHBOARD_HEALTH_URL }}
        run: deno task deploy
