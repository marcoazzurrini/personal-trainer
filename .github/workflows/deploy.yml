name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a push during a deploy waits its turn.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: 2.112.0 broke `supabase link` (inserted_at SchemaError)
          version: 2.111.0
      - name: Write local function env
        run: |
          printf 'API_TOKEN=local-dev-token\nAPI_TOKEN_PREVIOUS=local-dev-token-previous\nDATABASE_URL=postgresql://postgres:postgres@db:5432/postgres\n' \
            > supabase/functions/.env
      - name: Start local stack (db, functions, gateway only)
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,logflare,vector
      - run: deno task test

  deploy:
    needs: [checks, test]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: cawwcmsmqhrqiyjlrhba
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: 2.112.0 broke `supabase link` (inserted_at SchemaError)
          version: 2.111.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy api
