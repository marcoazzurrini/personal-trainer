pre-commit:
  parallel: true
  jobs:
    # Needs Gitleaks on the PATH: brew install gitleaks. CI scans the whole tree.
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner
    - name: format
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,yml,yaml,css,md}"
      exclude:
        # Skill frontmatter is an executable contract. Keep it out of formatters.
        - plugin/**
      run: bun run fmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: bun run lint {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: bun run check
    - name: web-types
      glob: "apps/web/**/*.{ts,tsx}"
      run: bun run --cwd apps/web check
