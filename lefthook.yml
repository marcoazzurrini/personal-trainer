pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: bun run secrets
    - name: format
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,yml,yaml,css,md}"
      exclude:
        - docs/**
        # Skill frontmatter is an executable contract. Keep it out of formatters.
        - plugin/**
      run: bun run fmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: bun run lint {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: bun run check
    - name: web-types
      glob: "web/**/*.{ts,tsx}"
      run: bun run --cwd web check
